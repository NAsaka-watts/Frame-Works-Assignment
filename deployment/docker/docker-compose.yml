  #     - covid-analyzer-network

  # Optional: Nginx reverse proxy (uncomment if needed)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - covid-analyzer
  #   restart: unless-stopped
  #   networks:
  #     - covid-analyzer-network

networks:
  covid-analyzer-network:
    driver: bridge

volumes:
  redis-data: